name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Generate silver + analytics + alerts
        run: |
          python src/phase1_parse.py
          python src/phase2_analyze.py
          python src/phase3_alert.py
      - name: Run pytest
        run: pytest tests/ -q
